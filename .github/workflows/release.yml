name: Release

# One run per module tag: v1.2.3 for the root module, layers/v1.2.3, adapters/gin/v1.2.3...
on:
  push:
    tags: ['v*', '**/v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - name: Release notes
        run: scripts/release.sh --notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ runner.temp }}/notes.md
          # The repository's latest release stays the root module's.
          make_latest: ${{ startsWith(github.ref_name, 'v') }}
      - name: Warm proxy.golang.org
        run: |
          tag="${GITHUB_REF_NAME}"
          dir="${tag%v*}"
          curl -sf "https://proxy.golang.org/go.chanx.dev${dir:+/${dir%/}}/@v/v${tag##*v}.info" || true

  docs:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
