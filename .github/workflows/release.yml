name: Release

# make release commits the versions as "chore(release): ..."; this tags them once CI
# passes on that commit. A pushed Go tag is published for good (proxy.golang.org and
# sum.golang.org keep it), so nothing is tagged before the tests are green.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      # Each module whose CHANGELOG.md opens on a version with no tag yet, tagged on the
      # commit CI tested. The tag and its release come from one call, so a re-run finishes
      # whatever a failed run left.
      - name: Pending tags
        run: scripts/release.sh --pending | tee "$RUNNER_TEMP/pending"
      - name: Tag and release
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          while read -r tag; do
            scripts/release.sh --notes "$tag" >"$RUNNER_TEMP/notes.md"
            # The repository's latest release stays the root module's.
            latest=false
            [[ "$tag" == v* ]] && latest=true
            gh release create "$tag" --target "$SHA" --title "$tag" \
              --notes-file "$RUNNER_TEMP/notes.md" --latest="$latest"
          done <"$RUNNER_TEMP/pending"
      # A tag made through the API takes a moment to show up over git, and the proxy caches
      # an "unknown revision" for a while, so ask only after a pause, and retry.
      - name: Warm proxy.golang.org
        run: |
          sleep 60
          while read -r tag; do
            dir="${tag%v*}"
            module="$(awk '/^module /{print $2}' "${dir:-./}go.mod")"
            for _ in 1 2 3 4 5; do
              curl -sf "https://proxy.golang.org/$module/@v/v${tag##*v}.info" && break
              sleep 30
            done
            echo
          done <"$RUNNER_TEMP/pending"

  docs:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
