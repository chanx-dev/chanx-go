# One job per adapter module, so a framework release that breaks one adapter
# fails only that job. Part of CI on pushes and pull requests; weekly on its own to catch
# a framework release between pushes.
name: Adapters

on:
  workflow_call:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  adaptertest:
    name: ${{ matrix.adapter }} (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25', '1.26']
        adapter: [gin, echo, fiber]
    env:
      # Each module on its own, as users get it, on exactly the toolchain under test.
      GOWORK: 'off'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - working-directory: adapters/${{ matrix.adapter }}
        run: go vet ./... && go test -race ./...
      - name: against the framework's latest release
        if: matrix.go == '1.26'
        working-directory: adapters/${{ matrix.adapter }}
        env:
          GOTOOLCHAIN: auto # the latest releases may need a newer Go
        run: go get -u -t ./... && go test -race ./...
