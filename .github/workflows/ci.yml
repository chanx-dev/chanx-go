name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (go ${{ matrix.go }}, ${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25', '1.26']
        module: [., layers, layers/redis, examples, docs]
        exclude:
          # examples and docs are not published and follow the latest Go (see their go.mod).
          - go: '1.25'
            module: examples
          - go: '1.25'
            module: docs
    env:
      # Each module on its own, as users get it, on exactly the toolchain under test.
      GOWORK: 'off'
      GOTOOLCHAIN: local
    services:
      redis:
        image: redis:7
        ports: ['6393:6379']
      redis-2:
        image: redis:7
        ports: ['6394:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: test
        working-directory: ${{ matrix.module }}
        env:
          CHANX_GO_REDIS: redis://localhost:6393,redis://localhost:6394
        run: go test -race -coverprofile=coverage.out ./...
      - name: govulncheck
        # govulncheck itself needs the latest Go; the dependencies it checks are the same.
        if: matrix.go == '1.26'
        working-directory: ${{ matrix.module }}
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  lint:
    name: lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [., layers, layers/redis, adapters/gin, adapters/echo, adapters/fiber, examples, docs]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: ${{ matrix.module }}

  adapters:
    uses: ./.github/workflows/adapters.yml
