[changelog]
header = "# Changelog\n"
body = """
{% if version %}## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }}){% else %}## Unreleased{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}
{% endfor %}{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^docs", group = "Documentation" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^(chore|ci|test|build)", group = "Maintenance" },
]
tag_pattern = "^v[0-9]"

# The next version comes from the commits since the last root tag (vX.Y.Z), as
# commitizen's bump: fix -> patch, feat -> minor, a breaking change -> major. While
# on 0.x, a breaking change bumps the minor, so v1.0.0 is only cut on purpose.
[bump]
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "v0.1.0"
